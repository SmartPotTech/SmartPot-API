name: Mark stale issues and pull requests

on:
  schedule:
    - cron: '0 12 * * *'

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 30
          days-before-close: 7
          stale-issue-message: 'Este issue lleva 30 días sin actividad. Se cerrará en 7 días si nadie lo retoma.'
          stale-pr-message: 'Este pull request lleva 30 días sin actividad. Se cerrará en 7 días si nadie lo retoma.'
          stale-issue-label: 'no-issue-activity'
          stale-pr-label: 'no-pr-activity'
