name: Snyk Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Escaneo semanal los lunes a las 07:00 UTC
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  SNYK_TOKEN: ${{ secrets.SNYK_PAT_ORG || secrets.SNYK_TOKEN }}
  SNYK_CFG_ORG: ${{ vars.SNYK_CFG_ORG || vars.SNYK_SLUG_ORG || '9c3602e7-da44-48d5-a4d1-5c2f09f7eafe' }}

jobs:
  snyk-sca:
    name: Snyk Open Source (Maven / Java)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@master

      - name: Run Snyk Test
        run: |
          snyk test --org="${{ env.SNYK_CFG_ORG }}" --severity-threshold=medium --sarif-file-output=snyk.sarif || {
            code=$?
            if [ $code -eq 1 ]; then
              echo "::warning::Snyk detectó vulnerabilidades en dependencias de Maven/Java."
            else
              echo "::error::Error al ejecutar Snyk CLI (código $code)."
              exit $code
            fi
          }

      - name: Upload SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('snyk.sarif') != ''
        with:
          sarif_file: snyk.sarif
          category: snyk-maven
