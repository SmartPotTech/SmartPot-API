name: Snyk Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Escaneo semanal los lunes a las 07:00 UTC
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      enforce_gate:
        description: 'Detener y bloquear pipeline ante vulnerabilidades altas/críticas'
        type: boolean
        default: false
      severity_threshold:
        description: 'Umbral de severidad de Snyk'
        type: choice
        default: 'high'
        options:
          - medium
          - high
          - critical

permissions:
  contents: write
  pull-requests: write
  security-events: write

env:
  SNYK_TOKEN: ${{ secrets.SNYK_PAT_ORG || secrets.SNYK_TOKEN }}
  SNYK_CFG_ORG: ${{ vars.SNYK_CFG_ORG || vars.SNYK_SLUG_ORG || '9c3602e7-da44-48d5-a4d1-5c2f09f7eafe' }}

jobs:
  snyk-sca:
    name: Snyk Open Source & Monitor (Maven / Java)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@master

      # 1. Security Gate: Alertar o Detener
      - name: Run Snyk Test (Security Gate)
        run: |
          threshold="${{ inputs.severity_threshold || 'high' }}"
          echo "::notice::Ejecutando Snyk Security Gate con umbral: $threshold"
          snyk test --org="${{ env.SNYK_CFG_ORG }}" --severity-threshold="$threshold" --sarif-file-output=snyk.sarif || {
            code=$?
            if [ $code -eq 1 ]; then
              if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ inputs.enforce_gate }}" = "true" ]; then
                echo "::error::Snyk Security Gate BLOQUEADO: Se detectaron vulnerabilidades de severidad $threshold en dependencias de Maven/Java."
                exit 1
              else
                echo "::warning::Snyk detectó vulnerabilidades en dependencias de Maven/Java."
              fi
            else
              echo "::error::Error al ejecutar Snyk CLI (código $code)."
              exit $code
            fi
          }

      # 2. Alertar: Subir SARIF a GitHub Security Tab
      - name: Upload SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('snyk.sarif') != ''
        with:
          sarif_file: snyk.sarif
          category: snyk-maven

      # 3. Monitorear: snyk monitor en rama principal, schedule o dispatch
      - name: Snyk Monitor (Continuous Protection & Auto Fix PRs)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          echo "::notice::Publicando snapshot a Snyk Platform para monitoreo continuo 24/7 y habilitación de Automatic Fix PRs..."
          snyk monitor --org="${{ env.SNYK_CFG_ORG }}" --project-name="SmartPotTech/SmartPot-API"
