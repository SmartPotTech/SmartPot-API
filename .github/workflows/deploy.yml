name: Deploy to Production

# Pide el despliegue al workflow central de SmartPotTech/.github, que corre de a uno.
on:
  workflow_run:
    workflows: [ "Publish Docker Images" ]
    types: [ completed ]
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Request Deployment
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    uses: SmartPotTech/.github/.github/workflows/request-deploy.yml@main
    secrets:
      DEPLOY_DISPATCH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
