smartpot:
  web-base-url: http://localhost:5173
  public-api-url: http://localhost:8091
  security:
    jwt-secret: test-secret-for-smartpot-api-unit-tests-0123456789
    jwt-expiration: PT1H
    aes-key: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
    cors-allowed-origins: http://localhost:5173
    rate-limit-per-minute: 1000
    auth-rate-limit-per-minute: 1000
    password-reset-expiration: PT30M
  readings:
    min-interval: PT5S
    max-page-size: 2000
  mail:
    enabled: false
    from: SmartPot <no-reply@smartpot.test>
  mqtt:
    enabled: false
    broker-uri: tcp://localhost:1883
    client-id: smartpot-api-test
    username: smartpot-api
    password: ""
    topic-prefix: smartpot/v1
    public-host: localhost
    public-port: 1883
    public-tls: false
    websocket-url: ws://localhost:9001
    command-timeout: PT2M
  ai:
    enabled: false
    base-url: http://localhost:8000
    token: test
    timeout: PT2S
    evaluation-interval: PT5M
    automation-cooldown: PT10M
    history-size: 48
