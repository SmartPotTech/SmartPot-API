# Toda la configuración viene de variables de entorno; en local se leen desde .env.
spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: smartpot-api
  threads:
    virtual:
      enabled: true
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/smartpot}
  data:
    mongodb:
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 2s
      connect-timeout: 2s
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8091}
  forward-headers-strategy: framework
  shutdown: graceful
  compression:
    enabled: true
  error:
    include-stacktrace: never
    include-message: never

smartpot:
  web-base-url: ${WEB_BASE_URL:http://localhost:5173}
  public-api-url: ${PUBLIC_API_URL:http://localhost:8091}
  security:
    jwt-secret: ${SMARTPOT_JWT_SECRET}
    jwt-expiration: ${JWT_EXPIRATION:P7D}
    aes-key: ${SMARTPOT_AES_KEY}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    rate-limit-per-minute: ${RATE_LIMIT_PER_MINUTE:300}
    auth-rate-limit-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:10}
    password-reset-expiration: ${PASSWORD_RESET_EXPIRATION:PT30M}
  readings:
    min-interval: ${READINGS_MIN_INTERVAL:PT5S}
    max-page-size: ${READINGS_MAX_PAGE_SIZE:2000}
  mail:
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:SmartPot <no-reply@smartpot.app>}
  mqtt:
    enabled: ${MQTT_ENABLED:true}
    broker-uri: ${MQTT_BROKER_URI:tcp://localhost:1883}
    client-id: ${MQTT_CLIENT_ID:smartpot-api}
    username: ${MQTT_ADMIN_USERNAME:smartpot-api}
    password: ${MQTT_ADMIN_PASSWORD:}
    topic-prefix: ${MQTT_TOPIC_PREFIX:smartpot/v1}
    public-host: ${MQTT_PUBLIC_HOST:localhost}
    public-port: ${MQTT_PUBLIC_PORT:1883}
    public-tls: ${MQTT_PUBLIC_TLS:false}
    websocket-url: ${MQTT_WEBSOCKET_URL:ws://localhost:9001}
    command-timeout: ${MQTT_COMMAND_TIMEOUT:PT2M}
  ai:
    enabled: ${AI_ENABLED:true}
    base-url: ${AI_BASE_URL:http://localhost:8000}
    token: ${SMARTPOT_AI_TOKEN:}
    timeout: ${AI_TIMEOUT:PT5S}
    evaluation-interval: ${AI_EVALUATION_INTERVAL:PT5M}
    automation-cooldown: ${AI_AUTOMATION_COOLDOWN:PT10M}
    history-size: ${AI_HISTORY_SIZE:48}

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    path: /docs
    enabled: ${API_DOCS_ENABLED:true}
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    org.eclipse.paho: WARN
    org.mongodb.driver: WARN
